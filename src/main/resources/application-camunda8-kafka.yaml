logging:
  level:
    io.camunda.zeebe.client.impl.ZeebeCallCredentials: ERROR
camunda:
  client:
    enabled: true
    rest-address: http://localhost:8088
    grpc-address: http://localhost:26500
    mode: self-managed
    auth:
      token-url: http://localhost:18080/auth/realms/camunda-platform/protocol/openid-connect/token
      client-id: orchestration
      client-secret: secret
      connect-timeout: PT10S
      read-timeout: PT30S
    request-timeout: PT20S
    request-timeout-offset: PT10S
  zeebe:
    kafka-exporter:
      topic-name: zeebe
vanillabp:
  cockpit:
    kafka:
      group-id-suffix: loan-approval
  workflow-modules:
    loan-approval:
      adapters:
        camunda8:
          resources-location: classpath*:/processes/camunda8-kafka
          stream-enabled: true
          stream-timeout: PT5M
